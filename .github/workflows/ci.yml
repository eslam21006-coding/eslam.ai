name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Database tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          container_name="eslam-ai-db-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$container_name" \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine >/dev/null
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if docker exec "$container_name" pg_isready --username postgres >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Postgres did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          docker exec --interactive "$container_name" \
            psql --set ON_ERROR_STOP=1 --username postgres \
            < supabase/tests/bootstrap_auth.sql

          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            docker exec --interactive "$container_name" \
              psql --set ON_ERROR_STOP=1 --username postgres \
              < "$migration"
          done

          docker exec --interactive "$container_name" \
            psql --set ON_ERROR_STOP=1 --username postgres \
            < supabase/tests/business_dna_rls_runtime.sql

      - name: Build
        run: npm run build
