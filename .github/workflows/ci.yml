name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Database tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          container_name="eslam-ai-db-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$container_name" \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine >/dev/null
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT

          ready_streak=0
          for attempt in {1..60}; do
            if docker exec "$container_name" \
              psql --username postgres --dbname postgres --tuples-only --no-align \
              --command 'select 1' >/dev/null 2>&1; then
              ready_streak=$((ready_streak + 1))
              if [[ "$ready_streak" -ge 3 ]]; then
                break
              fi
            else
              ready_streak=0
            fi

            if [[ "$attempt" -eq 60 ]]; then
              echo "Postgres did not become stably ready" >&2
              docker logs "$container_name" >&2 || true
              exit 1
            fi
            sleep 1
          done

          docker exec --interactive "$container_name" \
            psql --set ON_ERROR_STOP=1 --username postgres \
            < supabase/tests/bootstrap_auth.sql

          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            docker exec --interactive "$container_name" \
              psql --set ON_ERROR_STOP=1 --username postgres \
              < "$migration"
          done

          for regression in \
            supabase/tests/business_dna_rls_runtime.sql \
            supabase/tests/conversations_rls_runtime.sql \
            supabase/tests/admin_authorization_runtime.sql \
            supabase/tests/eslam_brain_runtime.sql \
            supabase/tests/teach_eslam_runtime.sql \
            supabase/tests/teaching_lineage_runtime.sql \
            supabase/tests/teaching_review_runtime.sql \
            supabase/tests/voice_recordings_runtime.sql \
            supabase/tests/voice_transcriptions_runtime.sql \
            supabase/tests/voice_teaching_runtime.sql \
            supabase/tests/voice_teaching_audit_runtime.sql \
            supabase/tests/document_teaching_uploads_runtime.sql; do
            echo "Running $regression"
            docker exec --interactive "$container_name" \
              psql --set ON_ERROR_STOP=1 --username postgres \
              < "$regression"
          done

      - name: Build
        run: npm run build
